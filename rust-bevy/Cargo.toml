[package]
name = "lattice-observatory"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = ["std", "async_executor", "bevy_log", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit", "webgpu", "tonemapping_luts", "ktx2", "zstd"] }
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
